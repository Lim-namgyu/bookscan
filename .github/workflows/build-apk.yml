# 북스캔 APK 빌드: main 에 올리거나 Actions 화면에서 수동 실행하면
# 서명된 설치용 APK 를 만들어 GitHub Release 에 올린다(폰에서 바로 내려받아 설치 가능).
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        working-directory: android/BookScan
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp android/BookScan/app/build/outputs/apk/release/app-release.apk "out/BookScan-${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BookScan-apk
          path: out/*.apk

      - name: Release 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BookScan 빌드 ${{ github.run_number }}
          body: "커밋 ${{ github.sha }} 에서 빌드한 설치용 APK"
          files: out/*.apk
          make_latest: true
